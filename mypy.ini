# Mory Assistant - mypy configuration
# Docs: https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = True

# Lenient mode (do not require type hints on all functions)
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

# Ignore missing imports (third-party libs without type stubs)
ignore_missing_imports = True

# Do not follow imports into unchecked modules (avoid syntax errors in other files)
follow_imports = silent

# Exclude test directories
exclude = (?x)(
    ^tests/
    | ^test_.*\.py$
    )

# Disable strict optional checks
no_strict_optional = True

# Disable some error codes to avoid being too strict
disable_error_code = var-annotated,return-value
