# Alembic config for database schema versioning.

[alembic]
# Migration script path.
script_location = migrations

# SQLite database URL. %(here)s points to the project root.
# [P0 修复 Task-04] 此处为兜底默认值，实际运行时由 migrations/env.py:get_url() 覆盖：
#   优先级：DATABASE_URL（完整 URL） > MORY_DB_PATH（仅路径） > 下方默认 mory.db
# 媒体模式或多实例部署时设置 MORY_DB_PATH=mory_media.db 避免迁移写错库。
sqlalchemy.url = sqlite:///%(here)s/mory.db

# Logging config.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
