# Alembic config for database schema versioning.

[alembic]
# Migration script path.
script_location = migrations

# SQLite database URL. %(here)s points to the project root.
# Fallback only; migrations/env.py:get_url() overrides this value.
# Priority: DATABASE_URL > MORY_DB_PATH > the default mory.db below.
# Set MORY_DB_PATH for media mode or multi-instance deployments.
sqlalchemy.url = sqlite:///%(here)s/mory.db

# Logging config.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
