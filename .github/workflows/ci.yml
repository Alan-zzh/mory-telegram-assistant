# Mory小助理 CI/CD 流水线
# 触发条件：push 到 main/develop 分支，PR 到 main 分支

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 测试任务：代码质量检查 + 单元测试
  # ══════════════════════════════════════════════════════════════════════
  test:
    name: 代码质量检查与测试
    runs-on: ubuntu-latest
    
    steps:
      # 步骤 1：检出代码
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 步骤 2：设置 Python 3.12
      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      # 步骤 3：安装依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # 安装开发依赖（lint + 测试 + 类型检查）
          pip install flake8 pytest pytest-cov mypy
      
      # 步骤 4：Lint 检查（flake8）
      - name: Lint 检查（flake8）
        run: |
          # 忽略 E501（行长度）、W503（换行操作符）
          # 当前仓库存在大量历史格式债务；清单为已稳定化关键文件。
          # 注：core/cache_manager.py 已在 v5.27 后被移除，由 core/database.py 接替；
          # core/ai_engine.py 的 124 项格式债务已于 v5.38.23 清理并纳入检查。
          flake8 \
            core/ai_engine.py \
            core/settings.py \
            core/database.py \
            core/user_lifecycle.py \
            core/metrics.py \
            core/anomaly_detector.py \
            dashboard/app.py \
            dashboard/api/metrics_api.py \
            --ignore=E501,W503,W504,E203,E402 \
            --max-line-length=120 \
            --statistics
      
      # 步骤 5：类型检查（mypy）
      - name: 类型检查（mypy）
        run: |
          # 使用 mypy.ini 配置，检查核心模块
          # 宽松模式，忽略缺失导入，不跟随导入
          # core/cache_manager.py 已移除，由 core/database.py 接替；
          # core/ai_engine.py 的 10 项类型标注债务已于 v5.38.24 清理并纳入。
          mypy core/settings.py core/database.py core/ai_engine.py core/user_lifecycle.py --follow-imports=silent
      
      # 步骤 6：单元测试 + 覆盖率
      - name: 单元测试 + 覆盖率
        run: |
          # 运行 tests/unit/ 目录下的所有测试
          # 生成覆盖率报告
          pytest tests/unit/ \
            --cov=core \
            --cov=modules \
            --cov=dashboard \
            --cov-report=term-missing \
            --cov-report=html \
            --fail-under=25 \
            -v \
            --tb=short
      
      # 步骤 6.5：Docstring 覆盖率检查
      - name: Docstring 覆盖率检查（interrogate）
        run: |
          # 读取 pyproject.toml 配置，检查核心模块
          # 阈值 80%，排除 tests/，忽略魔法方法和嵌套函数
          interrogate -c pyproject.toml core/ modules/ dashboard/
      
      # 步骤 7：编译检查
      - name: 编译检查
        run: |
          # 检查所有 Python 文件是否能正常编译
          python -m compileall core/ modules/ dashboard/ -q

      # 步骤 7.5：DB 方法注册验证（AGENTS.md 部署前必跑门禁）
      - name: DB 方法注册验证（verify_db_methods）
        run: |
          # 新增 Repo 方法必须同步 _REPO_METHOD_MAP/_REPO_ATTR_MAP，漏注册会启动失败
          python scripts/verify_db_methods.py

      # 步骤 7.6：文档一致性验证（AGENTS.md 合入门禁，含版本五源/行数/条目长度断言）
      - name: 文档一致性验证（doc_consistency）
        run: |
          # 根文档数量须与 METRICS 块一致；版本五源一致；行数与 CHANGELOG 条目长度上限
          python scripts/doc_consistency.py

      # 步骤 7.7：配置三处同步断言（AGENTS.md 改配置必跑门禁）
      - name: 配置三处同步断言（check_config_sync）
        run: |
          # config.json.example ↔ Dashboard ALLOWED_CONFIG_FIELDS 差集断言
          python scripts/check_config_sync.py
      
      # 步骤 8：上传覆盖率报告（可选）
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════
