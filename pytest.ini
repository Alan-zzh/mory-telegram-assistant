# pytest 配置 - Mory小助理测试框架
# 覆盖率统计：pytest --cov=core --cov=modules --cov=dashboard --cov-report=term-missing

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    live_llm: requires an explicitly configured real LLM judge and is excluded from CI
