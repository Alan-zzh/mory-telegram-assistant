version: '3.8'

services:
  mory:
    build: .
    container_name: mory-assistant
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./mory.db:/app/mory.db
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai
    network_mode: bridge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('https://api.telegram.org')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    container_name: mory-dashboard
    restart: unless-stopped
    command: ["python3", "start_dashboard.py"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./mory.db:/app/mory.db
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mory:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
